<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200" fill="none">
  <defs>
    <linearGradient id="heroBase" x1="180" y1="80" x2="1800" y2="1040" gradientUnits="userSpaceOnUse">
      <stop stop-color="#191510"/>
      <stop offset="0.58" stop-color="#221C16"/>
      <stop offset="1" stop-color="#342D25"/>
    </linearGradient>
    <linearGradient id="leftFade" x1="0" y1="0" x2="1240" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F1E8" stop-opacity="0.94"/>
      <stop offset="0.34" stop-color="#F7F1E8" stop-opacity="0.70"/>
      <stop offset="0.72" stop-color="#F7F1E8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#F7F1E8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="warmVeil" x1="960" y1="0" x2="960" y2="1200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D7B76C" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#111111" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="focusFade" x1="920" y1="0" x2="1920" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity="0"/>
      <stop offset="0.12" stop-color="white" stop-opacity="0.72"/>
      <stop offset="0.84" stop-color="white" stop-opacity="1"/>
      <stop offset="1" stop-color="white" stop-opacity="0.90"/>
    </linearGradient>
    <radialGradient id="highlight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1490 180) rotate(90) scale(320 420)">
      <stop stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldBloom" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1320 860) rotate(90) scale(250 340)">
      <stop stop-color="#D7B76C" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#D7B76C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="edgeShade" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1790 620) rotate(180) scale(860 1040)">
      <stop stop-color="#0F0D0B" stop-opacity="0"/>
      <stop offset="1" stop-color="#0F0D0B" stop-opacity="0.34"/>
    </radialGradient>
    <filter id="blurWide" x="-12%" y="-12%" width="124%" height="124%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="blurSoft" x="-8%" y="-8%" width="116%" height="116%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.08"/>
      </feComponentTransfer>
    </filter>
    <mask id="focusMask">
      <rect width="1920" height="1200" fill="black"/>
      <rect x="920" y="0" width="1000" height="1200" fill="url(#focusFade)"/>
    </mask>
  </defs>

  <rect width="1920" height="1200" fill="url(#heroBase)"/>

  <image
    href="hero-trust-bg.webp"
    x="-140"
    y="-80"
    width="2200"
    height="1360"
    preserveAspectRatio="xMidYMid slice"
    opacity="0.30"
    filter="url(#blurWide)"/>

  <image
    href="hero-trust-bg.webp"
    x="930"
    y="255"
    width="1010"
    height="532"
    preserveAspectRatio="xMidYMid meet"
    opacity="0.88"
    filter="url(#blurSoft)"
    mask="url(#focusMask)"/>

  <rect width="1920" height="1200" fill="url(#leftFade)"/>
  <rect width="1920" height="1200" fill="url(#warmVeil)"/>
  <rect width="1920" height="1200" fill="url(#edgeShade)"/>
  <circle cx="1490" cy="180" r="320" fill="url(#highlight)"/>
  <circle cx="1320" cy="860" r="250" fill="url(#goldBloom)"/>

  <g opacity="0.15">
    <path d="M1325 -30C1410 80 1505 250 1600 610" stroke="#D7B76C" stroke-width="4"/>
    <path d="M1625 -60C1710 90 1770 270 1840 560" stroke="#FFFFFF" stroke-width="1.5"/>
  </g>

  <rect width="1920" height="1200" filter="url(#grain)" opacity="0.40"/>
</svg>
