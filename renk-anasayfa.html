<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Renk Önizleme — Ana Sayfa</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #111;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ── TOP BAR ── */
    .bar {
      flex-shrink: 0;
      background: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      height: 64px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .bar::-webkit-scrollbar { display: none; }

    .bar-title {
      font-size: 12px;
      font-weight: 700;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .bar-divider {
      width: 1px;
      height: 28px;
      background: #333;
      flex-shrink: 0;
    }

    .palettes {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .pal-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 13px 7px 8px;
      border-radius: 999px;
      border: 1.5px solid transparent;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
      background: transparent;
    }
    .pal-btn:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.12); }
    .pal-btn.active {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.28);
    }

    .pal-dots {
      display: flex;
      gap: 3px;
    }
    .pal-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .pal-dot.white {
      background: #fff;
      border: 1px solid rgba(255,255,255,0.3);
    }

    .pal-btn-label {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,255,255,0.65);
      line-height: 1;
    }
    .pal-btn-num {
      font-size: 10px;
      color: rgba(255,255,255,0.3);
      margin-left: 2px;
    }
    .pal-btn.active .pal-btn-label { color: #fff; }

    /* ── SCALE CONTROLS ── */
    .bar-controls {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .scale-btn {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.6);
      border-radius: 7px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.15s;
    }
    .scale-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
    .scale-btn.active { background: rgba(255,255,255,0.18); color: #fff; border-color: rgba(255,255,255,0.3); }

    /* ── IFRAME WRAPPER ── */
    .preview-wrap {
      flex: 1;
      overflow: hidden;
      position: relative;
      background: #0a0a0a;
    }

    .iframe-scaler {
      position: absolute;
      top: 0;
      left: 50%;
      transform-origin: top center;
      /* JS sets transform and width */
    }

    #preview {
      border: none;
      display: block;
      width: 1440px;
      height: 100%;
    }

    /* ── LOADING ── */
    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      background: #111;
      z-index: 10;
      transition: opacity 0.3s;
    }
    .loading.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 32px; height: 32px;
      border: 2.5px solid rgba(255,255,255,0.12);
      border-top-color: rgba(255,255,255,0.6);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading p { color: rgba(255,255,255,0.45); font-size: 13px; }

    /* ── ACTIVE INDICATOR ── */
    .active-info {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.72);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 999px;
      padding: 7px 16px;
      color: rgba(255,255,255,0.8);
      font-size: 12px;
      font-weight: 600;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
      white-space: nowrap;
      z-index: 5;
    }
    .active-info.show { opacity: 1; }
  </style>
</head>
<body>

<div class="bar">
  <span class="bar-title">Renk Paleti</span>
  <div class="bar-divider"></div>
  <div class="palettes" id="palettes"></div>
  <div class="bar-controls">
    <button class="scale-btn" data-scale="0.5">50%</button>
    <button class="scale-btn active" data-scale="0.65">65%</button>
    <button class="scale-btn" data-scale="0.8">80%</button>
    <button class="scale-btn" data-scale="1">Tam</button>
  </div>
</div>

<div class="preview-wrap">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>Ana sayfa yükleniyor…</p>
  </div>
  <div class="iframe-scaler" id="scaler">
    <iframe id="preview" src="./kktc-sirket-kurma.html" title="Ana Sayfa Önizleme"></iframe>
  </div>
  <div class="active-info" id="activeInfo"></div>
</div>

<script>
  const palettes = [
    { num: 'A', name: 'Gerçek Lacivert',        dark:'#0E1C2F', darkMid:'#142338', darkLight:'#1e3550', gold:'#B89245', rgb:'184,146,69',   goldDeep:'#5a3e10', goldRich:'#ccaf6b', goldLight:'#ddc38b' },
    { num: 'B', name: 'Ofis Duvarı (Teal)',      dark:'#1A2E2B', darkMid:'#21392c', darkLight:'#2c4a40', gold:'#C49A3C', rgb:'196,154,60',   goldDeep:'#6a5212', goldRich:'#d4b060', goldLight:'#e0c880' },
    { num: 'C', name: 'Antrasit + Canlı Altın',  dark:'#1C1C1E', darkMid:'#242424', darkLight:'#303030', gold:'#D4A843', rgb:'212,168,67',   goldDeep:'#7a5e18', goldRich:'#e0b855', goldLight:'#eacc80' },
    { num: '1', name: 'Saf Siyah + Klasik',      dark:'#111111', darkMid:'#181818', darkLight:'#242424', gold:'#B8973A', rgb:'184,151,58',   goldDeep:'#6a5418', goldRich:'#ccaf60', goldLight:'#ddc890' },
    { num: '2', name: 'Sıcak Siyah + Derin',     dark:'#100E0A', darkMid:'#1c180f', darkLight:'#28221a', gold:'#C49228', rgb:'196,146,40',   goldDeep:'#6a4e0e', goldRich:'#d4a848', goldLight:'#e0c070' },
    { num: '3', name: 'Grafit + Parlak',          dark:'#181818', darkMid:'#222222', darkLight:'#2e2e2e', gold:'#E0AE38', rgb:'224,174,56',   goldDeep:'#8a6410', goldRich:'#e8be55', goldLight:'#f0d080' },
    { num: '4', name: 'Soğuk Siyah + Platin',    dark:'#0C0C10', darkMid:'#141418', darkLight:'#1e1e24', gold:'#A89878', rgb:'168,152,120',  goldDeep:'#6a5e48', goldRich:'#c0b090', goldLight:'#d8ccb0' },
    { num: '5', name: 'Derin Siyah + Şampanya',  dark:'#080808', darkMid:'#101010', darkLight:'#1a1a1a', gold:'#D6BC82', rgb:'214,188,130',  goldDeep:'#8a7030', goldRich:'#e0cc98', goldLight:'#eeddb0' },
    { num: '6', name: 'Kömür Gri + Vurgulu',     dark:'#141210', darkMid:'#201c16', darkLight:'#2c2520', gold:'#CF9B2E', rgb:'207,155,46',   goldDeep:'#7a5a10', goldRich:'#ddb048', goldLight:'#e8c870' },
  ];

  let currentScale = 0.65;
  let iframeReady = false;
  let pendingPalette = null;
  let infoTimer = null;

  // Build palette buttons
  const pallettesEl = document.getElementById('palettes');
  palettes.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.className = 'pal-btn' + (i === 0 ? ' active' : '');
    btn.dataset.index = i;
    btn.innerHTML = `
      <div class="pal-dots">
        <div class="pal-dot" style="background:${p.dark}"></div>
        <div class="pal-dot" style="background:${p.gold}"></div>
        <div class="pal-dot white"></div>
      </div>
      <span class="pal-btn-label">${p.name}</span>
      <span class="pal-btn-num">${p.num}</span>`;
    btn.addEventListener('click', () => selectPalette(i));
    pallettesEl.appendChild(btn);
  });

  // Scale controls
  document.querySelectorAll('.scale-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.scale-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentScale = parseFloat(btn.dataset.scale);
      applyScale();
    });
  });

  function applyScale() {
    const wrap = document.querySelector('.preview-wrap');
    const scaler = document.getElementById('scaler');
    const iframe = document.getElementById('preview');
    const wrapH = wrap.clientHeight;
    const iframeW = 1440;
    scaler.style.transform = `translateX(-50%) scale(${currentScale})`;
    scaler.style.width = iframeW + 'px';
    iframe.style.height = Math.ceil(wrapH / currentScale) + 'px';
  }

  // Inject CSS into iframe
  function injectPalette(p) {
    const iframe = document.getElementById('preview');
    try {
      const doc = iframe.contentDocument;
      if (!doc) return;

      // Remove old injected style
      const old = doc.getElementById('__palette_override');
      if (old) old.remove();

      const style = doc.createElement('style');
      style.id = '__palette_override';
      style.textContent = `
        :root {
          --navy: ${p.dark} !important;
          --navy-mid: ${p.darkMid} !important;
          --navy-light: ${p.darkLight} !important;
          --navy-rgb: ${hexToRgb(p.dark)} !important;
          --gold: ${p.gold} !important;
          --gold-deep: ${p.goldDeep} !important;
          --gold-rich: ${p.goldRich} !important;
          --gold-light: ${p.goldLight} !important;
          --accent: ${p.gold} !important;
          --accent-rgb: ${p.rgb} !important;
          --orange: ${p.gold} !important;
          --orange-rgb: ${p.rgb} !important;
        }
        /* Hero override - hardcoded values */
        #hero {
          background: ${p.dark} !important;
        }
        .hero-slide {
          background-color: ${p.dark} !important;
        }
        /* Header */
        #header {
          background: ${p.dark} !important;
        }
        #header.scrolled {
          background: ${p.dark}f0 !important;
        }
      `;
      doc.head.appendChild(style);
    } catch(e) {
      console.warn('Inject failed:', e);
    }
  }

  function hexToRgb(hex) {
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    return `${r}, ${g}, ${b}`;
  }

  function selectPalette(i) {
    document.querySelectorAll('.pal-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.pal-btn')[i].classList.add('active');
    const p = palettes[i];
    if (iframeReady) {
      injectPalette(p);
    } else {
      pendingPalette = p;
    }
    // Show info toast
    const info = document.getElementById('activeInfo');
    info.textContent = `${p.num} — ${p.name} · ${p.dark} + ${p.gold}`;
    info.classList.add('show');
    clearTimeout(infoTimer);
    infoTimer = setTimeout(() => info.classList.remove('show'), 2500);
  }

  // Iframe load
  const iframe = document.getElementById('preview');
  iframe.addEventListener('load', () => {
    document.getElementById('loading').classList.add('hidden');
    iframeReady = true;
    applyScale();
    // Apply first palette
    if (pendingPalette) {
      injectPalette(pendingPalette);
      pendingPalette = null;
    } else {
      injectPalette(palettes[0]);
    }
  });

  window.addEventListener('resize', applyScale);
  applyScale();

  // Initial select
  selectPalette(0);
</script>

</body>
</html>
